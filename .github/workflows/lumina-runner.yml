name: Lumina Runner

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Aktion'
        required: true
        default: 'status'
        type: choice
        options:
          - backup
          - restart
          - start
          - status

jobs:
  lumina:
    runs-on: ${{ vars.HANNOVER_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lumina Runner action (no-op on hosted)
        run: |
          echo "action=${{ inputs.action }}"
          echo "HANNOVER_RUNNER=${{ vars.HANNOVER_RUNNER }}"
          echo "Auf ubuntu-latest: kein Yggdrasil, kein Daemon — nur Status-Report."
          echo "Sobald der Self-Hosted-Runner 'hannover-primary' online ist, greift er automatisch."

      - name: Status report
        run: |
          echo "## Lumina Runner Status"
          echo "Runner: ${{ runner.name }}"
          echo "Labels: ${{ runner.labels }}"
          echo "Aktion: ${{ inputs.action }}"
          echo "Hinweis: echter Overlay-Apply nur auf dem Hannover-Knoten."
